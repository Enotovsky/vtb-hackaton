# Развёртывание на сервере:
#   cd /root/vtb-family && docker compose up -d --build
# Сайт: http://<ip-сервера>:${HTTP_PORT} (по умолчанию 8010)
#
# Порт вынесен в .env, потому что 8000, 3000 и 8080 на сервере уже заняты другими проектами.

services:
  vtb-family:
    build: .
    image: vtb-family
    container_name: vtb-family
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8010}:8000"
    environment:
      # 1 — учебные профили (Александр, Мария, Макс) и демо-вход без пароля.
      VTB_DEMO_MODE: "${VTB_DEMO_MODE:-1}"
      TZ: Europe/Moscow
    volumes:
      - vtb_family_data:/app/data
      - vtb_family_uploads:/app/uploads
    # Без лимита json-file растёт бесконечно и со временем забивает диск.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  vtb_family_data:
  vtb_family_uploads:
